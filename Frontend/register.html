<!DOCTYPE html>
<html class="light" lang="en">

                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f4f3fa",
                        "surface-tint": "#4059aa",
                        "inverse-on-surface": "#f1f0f7",
                        "secondary-fixed": "#d3e4fe",
                        "surface-variant": "#e3e1e9",
                        "on-tertiary-fixed-variant": "#773205",
                        "background": "#faf8ff",
                        "secondary-container": "#d0e1fb",

                        "secondary": "#505f76",
                        "tertiary-fixed": "#ffdbcb",
                        "surface-container": "#eeedf4",
                        "surface": "#faf8ff",
                        "tertiary": "#4b1c00",
                        "on-secondary-fixed": "#0b1c30",
                        "tertiary-fixed-dim": "#ffb691",
                        "primary-container": "#1e3a8a",

                        "on-tertiary-container": "#f39461",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e3e1e9",
                        "outline": "#757682",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#00164e",
                        "on-background": "#1a1b21",
                        "secondary-fixed-dim": "#b7c8e1",
                        "primary-fixed": "#dce1ff",
                        "on-primary-container": "#90a8ff",
                        "inverse-surface": "#2f3036",
                        "inverse-primary": "#b6c4ff",
                        "on-primary-fixed-variant": "#264191",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e9e7ef"
                    },
                    "borderRadius": {

                    "spacing": {

                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

                }

        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface h-screen w-screen overflow-hidden flex font-body-md">

<div class="hidden lg:block lg:w-1/2 h-full relative">
    <img alt="Modern Hanoi apartment architecture" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyn-7bsswM1VfOiwiJTR-zocmspsQTTd5Unt8oJqIpAw0eM05Yc2b2076VCq-yJojmrgCLhrA4mMbSL9o2kHxnMOTouZVays-QR8H9XlfWxNVpmVn4QFUcBP5jpM99uhjYwvYeQ1PK7Z4YDk0DjxXPH2V6VLW2KBVopvUVFOAdOwp6NYUcPWB7CecM59mp0A2F2fKCfcizG26G66RoDfpGbNhYiZy5LtUu_jDUTGCw3caiIKLGNkBoL1h5enTr0kuP4lxfH0u-ZQ"/>
    <div class="absolute inset-0 bg-black/20"></div>
    <div class="absolute bottom-12 left-12 text-white">
        <h2 class="font-headline-xl text-headline-xl text-white mb-sm">HomeMatch</h2>
        <p class="font-body-lg text-body-lg text-white/90 max-w-md">Your trusted partner in smart real estate management across Southeast Asia.</p>
    </div>
</div>

<div class="w-full lg:w-1/2 h-full flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop overflow-y-auto">
    <div class="w-full max-w-md">
        <div class="text-center mb-xl">
            <h1 class="font-headline-xl-mobile md:font-headline-xl text-headline-xl-mobile md:text-headline-xl text-primary mb-xs">Tạo tài khoản mới</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Tham gia cộng đồng quản lý bất động sản thông minh</p>
        </div>

        <div id="alert" class="hidden p-3 rounded-lg text-sm mb-4" role="alert"></div>

        <form id="registerForm" class="space-y-md">
            <div class="flex p-1 bg-surface-container-low rounded-lg mb-lg">
                <button class="flex-1 py-2 text-center rounded-md bg-white shadow-sm font-label-md text-label-md text-primary transition-all" id="role-landlord" type="button">
                    Chủ nhà
                </button>
                <button class="flex-1 py-2 text-center rounded-md font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all" id="role-tenant" type="button">
                    Người thuê
                </button>
            </div>

            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-outline">person</span>
                </div>
                <input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="full_name" placeholder="Họ và tên *" type="text" required/>
            </div>

            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-outline">mail</span>
                </div>
                <input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="email" placeholder="Email *" type="email" required/>
            </div>

            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-outline">phone</span>
                </div>
                <input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="phone" placeholder="Số điện thoại" type="tel"/>
            </div>

            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-outline">lock</span>
                </div>
                <input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="password" placeholder="Mật khẩu *" type="password" required minlength="6"/>
                <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary focus:outline-none toggle-password" data-target="password" type="button">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>

            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-outline">lock</span>
                </div>
                <input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="confirm-password" placeholder="Xác nhận mật khẩu *" type="password" required/>
                <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary focus:outline-none toggle-password" data-target="confirm-password" type="button">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>

            <div class="flex items-start mt-sm">
                <div class="flex items-center h-5">
                    <input class="w-4 h-4 border border-outline-variant rounded bg-surface-container-lowest focus:ring-3 focus:ring-primary-fixed-dim text-primary" id="consent" type="checkbox"/>
                </div>
                <label class="ml-2 font-body-sm text-body-sm text-on-surface-variant" for="consent">
                    Tôi đồng ý với các <a class="text-primary hover:underline font-medium" href="#">Điều khoản</a> & <a class="text-primary hover:underline font-medium" href="#">Chính sách</a>
                </label>
            </div>

            <div class="pt-sm">
                <button id="submitBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-[12px] shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed" type="submit">
                    <span id="submitText">Đăng ký</span>
                </button>
            </div>
        </form>

        <div class="mt-xl text-center">
            <p class="font-body-sm text-body-sm text-on-surface-variant">
                Đã có tài khoản? <a class="font-label-md text-label-md text-primary hover:underline transition-all" href="login.html">Đăng nhập ngay</a>
            </p>
        </div>
    </div>
</div>

<script src="api.js"></script>

<script>
    // 1. Quản lý trạng thái Role (Vai trò)
    let selectedRole = 'owner'; // Mặc định là chủ nhà

    const btnLandlord = document.getElementById('role-landlord');
    const btnTenant = document.getElementById('role-tenant');

    btnLandlord.addEventListener('click', () => {
        selectedRole = 'owner';
        btnLandlord.classList.add('bg-white', 'shadow-sm', 'text-primary');
        btnLandlord.classList.remove('text-on-surface-variant');

        btnTenant.classList.remove('bg-white', 'shadow-sm', 'text-primary');
        btnTenant.classList.add('text-on-surface-variant');
    });

    btnTenant.addEventListener('click', () => {
        selectedRole = 'tenant';
        btnTenant.classList.add('bg-white', 'shadow-sm', 'text-primary');
        btnTenant.classList.remove('text-on-surface-variant');

        btnLandlord.classList.remove('bg-white', 'shadow-sm', 'text-primary');
        btnLandlord.classList.add('text-on-surface-variant');
    });

    // 2. Logic ẩn/hiện mật khẩu (Dùng cho cả 2 ô input)
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const icon = this.querySelector('.material-symbols-outlined');

            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    });

    // 3. Logic Alert (Hiển thị thông báo Lỗi/Thành công)
    function showAlert(message, type = 'error') {
        const alertBox = document.getElementById('alert');
        alertBox.textContent = message;
        alertBox.classList.remove('hidden');
        if (type === 'error') {
            alertBox.className = 'p-3 rounded-lg text-sm mb-4 bg-error-container text-on-error-container';
        } else {
            alertBox.className = 'p-3 rounded-lg text-sm mb-4 bg-success-container text-on-success-container';
        }
    }

    function hideAlert() {
        document.getElementById('alert').classList.add('hidden');
    }

    // 4. Nếu đã đăng nhập, chuyển về trang chủ tương ứng vai trò
    if (typeof getToken === 'function' && getToken()) {
        const currentUser = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
        if (currentUser && currentUser.role === 'sale') {
            window.location.href = 'saleAssign.html';
        } else if (currentUser && currentUser.role === 'legal') {
            window.location.href = 'legalReviewList.html';
        } else if (currentUser && currentUser.role === 'broker') {
            window.location.href = 'brokerHome.html';
        } else if (currentUser && currentUser.role === 'owner') {
            window.location.href = 'ownerSignmentTracking.html';
        } else if (currentUser && currentUser.role === 'accountant') {
            window.location.href = 'accountantContractApproval.html';
        } else if (currentUser && currentUser.role === 'admin') {
            window.location.href = 'adminDashboard.html';
        } else if (currentUser && currentUser.role === 'it') {
            window.location.href = 'IT_dashboard.html';
        } else {
            window.location.href = 'home.html';
        }
    }

    // 5. Xử lý sự kiện Submit Form (Gọi API qua hàm từ api.js)
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitText');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const fullName = document.getElementById('full_name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const consent = document.getElementById('consent').checked;

        // Validation phía client bổ sung
        if (!consent) {
            showAlert('Vui lòng đồng ý với Điều khoản & Chính sách');
            return;
        }

        if (password !== confirmPassword) {
            showAlert('Mật khẩu xác nhận không khớp');
            return;
        }

        if (password.length < 6) {
            showAlert('Mật khẩu phải có ít nhất 6 ký tự');
            return;
        }

        const payload = {
            full_name: fullName,
            email: email,
            phone: phone,
            password: password,
            role: selectedRole
        };

        // Chuyển nút sang trạng thái Loading
        submitBtn.disabled = true;
        submitText.textContent = 'Đang đăng ký...';

        try {
            // Sử dụng hàm register() từ file api.js
            await register(payload);

            showAlert('Đăng ký thành công! Đang chuyển sang trang đăng nhập...', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);

        } catch (err) {
            showAlert(err.message || 'Đăng ký thất bại');
            submitBtn.disabled = false;
            submitText.textContent = 'Đăng ký';
        }
    });
</script>

</body>
</html>
