<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 480px; margin-top: 60px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-4 text-center">Đăng ký tài khoản</h3>

            <div id="alert" class="alert d-none" role="alert"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Họ và tên *</label>
                    <input type="text" id="full_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" id="phone" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Số CCCD/CMND</label>
                    <input type="text" id="id_card" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu * <small class="text-muted">(tối thiểu 6 ký tự)</small></label>
                    <input type="password" id="password" class="form-control" required minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label">Vai trò *</label>
                    <select id="role" class="form-select" required>
                        <option value="">-- Chọn vai trò --</option>
                        <option value="owner">Chủ nhà</option>
                        <option value="tenant">Khách thuê</option>
                        <option value="agent">Nhân viên đại lý</option>
                        <option value="broker">Môi giới</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
            </form>

            <hr>
            <p class="text-center mb-0">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </p>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alert');

    function showAlert(message, type = 'danger') {
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            full_name: document.getElementById('full_name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            id_card: document.getElementById('id_card').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        };

        try {
            await register(payload);
            showAlert('Đăng ký thành công! Đang chuyển đến trang đăng nhập...', 'success');
            setTimeout(() => window.location.href = 'login.html', 1500);
        } catch (err) {
            showAlert(err.message);
        }
    });
</script>
</body>
</html>
