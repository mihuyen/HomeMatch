<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Property Manage</span>
        <button class="btn btn-outline-light btn-sm" onclick="handleLogout()">Đăng xuất</button>
    </div>
</nav>

<div class="container mt-4">
    <h2>Chào mừng <span id="userName"></span></h2>

    <div class="card mt-3" style="max-width: 600px;">
        <div class="card-body">
            <h5 class="card-title">Thông tin tài khoản</h5>
            <table class="table">
                <tbody>
                <tr><th width="160">Họ tên:</th><td id="info-name"></td></tr>
                <tr><th>Email:</th><td id="info-email"></td></tr>
                <tr><th>Số điện thoại:</th><td id="info-phone"></td></tr>
                <tr><th>Vai trò:</th><td id="info-role"></td></tr>
                <tr><th>Ngày tạo:</th><td id="info-created"></td></tr>
                </tbody>
            </table>
        </div>
    </div>


</div>

<script src="api.js"></script>
<script>
    async function init() {
        const user = await requireLogin();
        if (!user) return;

        document.getElementById('userName').textContent = user.full_name;
        document.getElementById('info-name').textContent = user.full_name;
        document.getElementById('info-email').textContent = user.email;
        document.getElementById('info-phone').textContent = user.phone || '(chưa cập nhật)';
        document.getElementById('info-role').textContent = user.role;
        document.getElementById('info-created').textContent = new Date(user.created_at).toLocaleString('vi-VN');
    }

    async function handleLogout() {
        if (confirm('Bạn có chắc muốn đăng xuất?')) {
            await logout();
        }
    }

    init();
</script>
</body>
</html>
