  <style>

      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #F8FAFC;

<body class="text-on-surface">
  <div id="sale-sidebar"></div>
  <script src="saleSidebar.js"></script>
  <script src="api.js"></script>

  <main class="max-w-[1440px] mx-auto p-margin-desktop min-h-screen">
    <div class="flex flex-col gap-lg max-w-[1200px] mx-auto">
      <div class="bg-white border border-outline-variant rounded-xl p-xl shadow-sm flex justify-between items-center">
        <div class="flex flex-col md:flex-row items-center gap-xl w-full">
          <div class="flex-1 space-y-sm">
            <div class="flex flex-wrap items-center gap-sm">
              <span class="bg-primary/10 text-primary text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider" id="property-type">---</span>
              <span class="text-outline font-label-sm">Mã HĐ: <span class="text-on-surface font-bold" id="contract-code">---</span></span>
            </div>
            <h2 class="font-headline-lg text-primary leading-tight" id="property-title">Phản hồi hợp đồng</h2>
            <div class="flex items-center gap-xs text-on-surface-variant font-body-sm">
              <span class="material-symbols-outlined text-[18px]">location_on</span>
              <span id="property-location">---</span>
            </div>
          </div>
          <div class="text-right bg-error-container/10 p-lg rounded-xl border border-error/20 shrink-0 self-stretch flex flex-col justify-center min-w-[200px]">
            <p class="text-[11px] uppercase tracking-wider text-outline font-bold mb-xs">Trạng thái thẩm định</p>
            <p class="text-error font-bold text-[18px] flex items-center justify-end gap-xs" id="legal-status">
              <span class="material-symbols-outlined text-[20px]">gavel</span>
              Chưa có phản hồi
            </p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-5 gap-lg items-start">
        <div class="lg:col-span-2 space-y-lg">
          <div class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm">
            <div class="bg-error-container/10 p-md border-b border-outline-variant flex justify-between items-center px-lg">
              <div class="flex items-center gap-base">
                <span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">feedback</span>
                <h3 class="font-headline-md text-primary text-[18px]">Phản hồi từ Pháp lý</h3>
              </div>
            </div>
            <div class="p-lg space-y-lg">
              <div class="flex items-center gap-md p-md bg-surface-container-low rounded-xl border border-outline-variant/50">
                <div>
                  <p class="font-bold text-on-surface text-body-md" id="reviewer-name">Chưa có người phản hồi</p>
                  <p class="text-label-sm text-on-surface-variant" id="reviewer-email">---</p>
                </div>
              </div>
              <div class="space-y-md">
                <h4 class="text-[11px] uppercase tracking-widest text-outline font-black">Nội dung phản hồi</h4>
                <div class="text-body-md text-on-surface-variant leading-relaxed" id="review-comment">
                  Chưa có phản hồi từ pháp lý.
                </div>
                <div class="text-xs text-on-surface-variant" id="reviewed-at"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="lg:col-span-3">
          <div class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm h-full">
            <div class="bg-surface-container-high/30 p-md border-b border-outline-variant px-lg flex justify-between items-center">
              <h3 class="font-headline-md text-primary text-[18px]">Nội dung điều khoản đã nộp</h3>
              <span class="material-symbols-outlined text-outline">description</span>
            </div>
            <div class="p-xl space-y-xl">
              <h4 class="font-bold text-primary border-b border-outline-variant pb-base text-[18px]">Điều khoản bổ sung</h4>
              <div class="space-y-lg">
                <div class="flex gap-md group">
                  <div class="text-body-md text-on-surface-variant leading-relaxed w-full" id="submitted-terms">
                    Chưa có nội dung điều khoản.
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-lg py-xl mt-lg border-t border-outline-variant/50">
        <button class="px-xl py-3 rounded-lg font-bold text-on-surface-variant border border-outline-variant hover:bg-surface-container-high transition-all active:scale-95 shadow-sm" id="back-btn">
          Quay lại
        </button>
        <button class="px-xl py-3 rounded-lg font-bold text-white bg-primary-container shadow-lg hover:bg-primary transition-all active:scale-95 flex items-center gap-md" id="resubmit-btn">
          <span class="material-symbols-outlined text-[20px]">send_and_archive</span>
          Sửa đổi &amp; Gửi lại
        </button>
      </div>
    </div>
  </main>

  <script>
    function formatCurrency(value) {
      if (value === null || value === undefined || value === '') return '---';
      const normalized = String(value).replace(/,/g, '');
      const number = Number(normalized);
      if (!Number.isFinite(number)) return String(value);
      return new Intl.NumberFormat('vi-VN').format(number) + ' VNĐ';
    }

    function formatDate(value) {
      if (!value) return '---';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '---';
      return date.toLocaleString('vi-VN');
    }

    function mapLegalStatus(status) {
      const normalized = String(status || '').toLowerCase();
      if (normalized.includes('approved')) return 'Đã phê duyệt';
      if (normalized.includes('changes')) return 'Yêu cầu sửa đổi';
      if (normalized.includes('rejected')) return 'Từ chối';
      return 'Chưa có phản hồi';
    }

    function mapContractType(type) {
      const normalized = String(type || '').toLowerCase();
      if (normalized.includes('custom')) return 'Ký gửi độc quyền';
      if (normalized.includes('standard')) return 'Ký gửi tiêu chuẩn';
      if (normalized.includes('consignment')) return 'Ký gửi';
      if (normalized.includes('renewal')) return 'Gia hạn';
      return type || 'Hợp đồng';
    }

    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        submissionId: params.get('submissionId') || '',
        address: params.get('address') || '',
        area: params.get('area') || '',
        bedrooms: params.get('bedrooms') || '',
        bathrooms: params.get('bathrooms') || '',
        proposedPrice: params.get('proposedPrice') || '',
        direction: params.get('direction') || '',
        propertyType: params.get('propertyType') || ''
      };
    }

    function buildSaleContractUrl(params) {
      const query = new URLSearchParams();
      Object.keys(params).forEach(k => {
        if (params[k] !== undefined && params[k] !== null) query.set(k, params[k]);
      });
      return `saleContract.html?${query.toString()}`;
    }

    async function loadResponse() {
      const params = getParams();
      if (!params.submissionId) {
        alert('Thiếu submissionId để tải phản hồi.');
        return;
      }

      const propertyTitle = document.getElementById('property-title');
      const propertyType = document.getElementById('property-type');
      const propertyLocation = document.getElementById('property-location');
      const contractCode = document.getElementById('contract-code');
      const legalStatus = document.getElementById('legal-status');
      const reviewerName = document.getElementById('reviewer-name');
      const reviewerEmail = document.getElementById('reviewer-email');
      const reviewComment = document.getElementById('review-comment');
      const reviewedAt = document.getElementById('reviewed-at');
      const submittedTerms = document.getElementById('submitted-terms');

      try {
        const data = await getSaleLegalResponse(params.submissionId);
        const response = data.legal_response || {};
        const property = data.property || {};

        propertyTitle.textContent = property.address || property.direction || 'Phản hồi hợp đồng';
        propertyType.textContent = mapContractType(data.contract_type || params.propertyType);
        propertyLocation.textContent = property.address || params.address || params.direction || '---';
        contractCode.textContent = data.contract_code || '---';

        legalStatus.innerHTML = `<span class="material-symbols-outlined text-[20px]">gavel</span> ${mapLegalStatus(response.status)}`;
        reviewerName.textContent = response.reviewer?.full_name || 'Chưa có người phản hồi';
        reviewerEmail.textContent = response.reviewer?.email || '---';
        reviewComment.textContent = response.review_comment || 'Chưa có phản hồi từ pháp lý.';
        reviewedAt.textContent = response.reviewed_at ? `Thời gian phản hồi: ${formatDate(response.reviewed_at)}` : '';
        submittedTerms.textContent = response.special_terms_requested || 'Chưa có nội dung điều khoản.';
      } catch (error) {
        console.error('Load sale response failed:', error);
        reviewComment.textContent = 'Không thể tải phản hồi từ pháp lý.';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof requireLogin === 'function') {
        await requireLogin();
      }

      const params = getParams();
      const backBtn = document.getElementById('back-btn');
      const resubmitBtn = document.getElementById('resubmit-btn');

      if (backBtn) {
        backBtn.addEventListener('click', () => {
          window.location.href = 'saleContracts.html';
        });
      }

      if (resubmitBtn) {
        resubmitBtn.addEventListener('click', () => {
          const targetUrl = buildSaleContractUrl(params);
          window.location.href = targetUrl;
        });
      }

      await loadResponse();
    });
  </script>
</body>
