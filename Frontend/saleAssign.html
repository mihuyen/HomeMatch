<script src="api.js"></script>
<script>
    (async function(){
        let currentStatus = '';
        let currentSearch = '';

        function getTabButtons(){
            return Array.from(document.querySelectorAll('div.mb-lg.flex.space-x-md.border-b button'));
        }

        function setActiveTab(activeIndex){
            getTabButtons().forEach((btn, index)=>{
                const isActive = index === activeIndex;
                btn.classList.toggle('text-primary', isActive);
                btn.classList.toggle('font-bold', isActive);
                btn.classList.toggle('border-b-2', isActive);
                btn.classList.toggle('border-primary', isActive);
                btn.classList.toggle('text-on-secondary-container', !isActive);
                btn.classList.toggle('hover:bg-surface-container-low', !isActive);
            });
        }

        try{
            await requireLogin();
        }catch(e){
            console.error('requireLogin failed', e);
            return;
        }
        async function loadAssignments(){
            try{
                const data = await listSaleAssignments({
                    limit: 50,
                    status: currentStatus || undefined,
                    search: currentSearch || undefined
                });
                const items = data.items || [];
                document.getElementById('assign-count').textContent = `${items.length} Requests Found`;
                const tbody = document.getElementById('assign-tbody');
                tbody.innerHTML = '';
                for(const it of items){
                    const tr = document.createElement('tr');
                    tr.className = 'bg-surface-container-lowest hover:bg-surface-container-low transition-colors group';
                    const submittedAt = it.submitted_at ? new Date(it.submitted_at).toLocaleString() : '-';
                    const statusLabel = (it.status === 'surveyed') ? 'Hoàn tất' : (it.status === 'cancelled' ? 'Đã hủy' : 'Chờ xử lý');
                    tr.innerHTML = `
<td class="p-md font-body-sm text-body-sm text-on-surface font-medium">${it.request_code}</td>
<td class="p-md font-body-sm text-body-sm text-on-surface">${(it.owner && it.owner.full_name) || '-'}</td>
<td class="p-md font-body-sm text-body-sm text-on-surface-variant truncate max-w-[200px]">${it.address || '-'}</td>
<td class="p-md font-body-sm text-body-sm text-on-surface-variant">${submittedAt}</td>
<td class="p-md"><span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-semibold ${it.status==='cancelled' ? 'bg-error-container text-on-error-container' : it.status==='surveyed' ? 'bg-[#D1FAE5] text-[#065F46]' : 'bg-[#FEF3C7] text-[#92400E]'} border border-[#FDE68A]">${statusLabel}</span></td>
<td class="p-md text-right space-x-sm">
                    <button data-submission="${it.submission_id}" class="create-appointment inline-block font-label-sm text-label-sm text-secondary border border-outline px-3 py-1.5 rounded hover:bg-surface-variant transition-colors">Tạo lịch hẹn</button>
                    <a href="saleAppointments.html?submissionId=${it.submission_id}" data-submission="${it.submission_id}" class="view-appointments inline-block font-label-sm text-label-sm text-secondary border border-outline px-3 py-1.5 rounded hover:bg-surface-variant transition-colors">Xem lịch hẹn</a>
                    <a href="saleAppointments.html?submissionId=${it.submission_id}" data-submission="${it.submission_id}" class="enter-result inline-block font-label-sm text-label-sm text-on-primary bg-primary px-3 py-1.5 rounded hover:bg-primary-fixed-dim hover:text-on-primary-fixed transition-colors">Nhập kết quả</a>
</td>
                    `;
                    tbody.appendChild(tr);
                }

                const total = Number(data.total || items.length);
                const visibleFrom = total > 0 ? 1 : 0;
                const visibleTo = items.length;
                document.getElementById('assign-page-summary').textContent = `Showing ${visibleFrom} to ${visibleTo} of ${total} entries`;

                // attach handlers
                document.querySelectorAll('.view-appointments').forEach(btn=>{
                    btn.addEventListener('click', e=>{
                        const id = e.currentTarget.dataset.submission;
                        window.location.href = `saleMeet.html?submissionId=${id}`;
                    });
                });
                document.querySelectorAll('.enter-result').forEach(btn=>{
                    btn.addEventListener('click', e=>{
                        const id = e.currentTarget.dataset.submission;
                        window.location.href = `saleAppointments.html?submissionId=${id}`;
                    });
                });
                document.querySelectorAll('.create-appointment').forEach(btn=>{
                    btn.addEventListener('click', e=>{
                        const id = e.currentTarget.dataset.submission;
                        // open saleMeet with create flag
                        window.location.href = `saleMeet.html?submissionId=${id}&create=1`;
                    });
                });

            }catch(err){
                console.error('loadAssignments error', err);
                document.getElementById('assign-count').textContent = 'Lỗi tải dữ liệu';
            }
        }

        const tabButtons = getTabButtons();
        const tabStatusMap = ['', 'pending', 'surveyed', 'cancelled'];
        tabButtons.forEach((btn, index)=>{
            btn.addEventListener('click', async ()=>{
                currentStatus = tabStatusMap[index] || '';
                setActiveTab(index);
                await loadAssignments();
            });
        });

        const filterButton = document.querySelector('div.p-md.border-b.border-outline-variant button');
        if (filterButton) {
            filterButton.addEventListener('click', async ()=>{
                const keyword = window.prompt('Nhập từ khóa tìm kiếm theo mã hồ sơ, chủ sở hữu hoặc địa chỉ:', currentSearch);
                if (keyword === null) return;
                currentSearch = keyword.trim();
                await loadAssignments();
            });
        }

        setActiveTab(0);

        loadAssignments();
    })();
</script>
