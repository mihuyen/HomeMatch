<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thông tin Lịch hẹn - HomeMatch</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
  body{font-family:Inter, sans-serif;background:#faf8ff}
</style>
</head>
<body class="flex flex-col min-h-screen">
  <div id="sale-sidebar"></div>
  <script src="saleSidebar.js"></script>
  <main class="flex-1 p-6">
    <div class="max-w-5xl mx-auto">
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold">Lịch hẹn - Thông tin căn nhà</h1>
          <p class="text-sm text-slate-600">Chi tiết lịch hẹn và thông tin bất động sản</p>
        </div>
        <div>
          <a href="saleAssign.html" class="px-4 py-2 border rounded-md">Quay lại phân công</a>
        </div>
      </div>

      <div id="property-card" class="mb-6 bg-white rounded-lg p-4 border hidden"></div>

      <div id="appointments-list" class="space-y-4"></div>

      <div id="no-appointments" class="hidden p-4 rounded bg-surface-container flex items-center justify-between">
        <div>
          <p class="font-medium">Chưa có lịch hẹn</p>
          <p class="text-sm text-slate-600">Hiện tại chưa có lịch hẹn cho yêu cầu này.</p>
        </div>
        <div>
          <a id="create-link" class="px-4 py-2 bg-blue-700 text-white rounded-md" href="#">Tạo lịch hẹn</a>
        </div>
      </div>

    </div>
  </main>

<script src="api.js"></script>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const submissionId = params.get('submissionId');
  if(!submissionId) return;
  try{ await requireLogin(); } catch(e){ console.error(e); return; }

  const propCard = document.getElementById('property-card');
  const list = document.getElementById('appointments-list');
  const noAppt = document.getElementById('no-appointments');
  const createLink = document.getElementById('create-link');
  createLink.href = `saleMeet.html?submissionId=${submissionId}&create=1`;

  propCard.innerHTML = `<div class="text-sm text-slate-500">Đang tải thông tin...</div>`;
  propCard.classList.remove('hidden');

  try{
    const prop = await getConsignment(submissionId);
    if(prop){
      propCard.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <p class="text-xs text-slate-500">Mã yêu cầu</p>
            <p class="font-medium">${prop.request_code || ''}</p>
          </div>
          <div>
            <p class="text-xs text-slate-500">Chủ nhà</p>
            <p class="font-medium">${(prop.owner && prop.owner.full_name) || '-'}</p>
          </div>
          <div>
            <p class="text-xs text-slate-500">Địa chỉ</p>
            <p class="font-medium">${prop.address || '-'}</p>
          </div>
        </div>
      `;
    }
  }catch(e){ console.warn('No consignment', e); propCard.innerHTML = '<div class="text-sm text-slate-500">Không thể tải thông tin tài sản</div>'; }

  list.innerHTML = '<div class="p-4">Đang tải lịch hẹn...</div>';
  try{
    const resp = await listSaleAppointments({ submissionId });
    let appts = (resp && resp.items) ? resp.items : (Array.isArray(resp) ? resp : []);
    if (submissionId) {
      appts = appts.filter(a => String(a.submission_id || '') === String(submissionId));
    }
    if(!appts || appts.length === 0){ list.innerHTML = ''; noAppt.classList.remove('hidden'); return; }
    noAppt.classList.add('hidden');
    list.innerHTML = '';
    appts.forEach(a=>{
      const scheduled = a.scheduled_time || a.appointment_date;
      const dateStr = scheduled ? new Date(scheduled).toLocaleString() : '-';
      const item = document.createElement('div');
      item.className = 'p-4 bg-white border rounded-lg';
      item.innerHTML = `
        <div class="flex justify-between items-start">
          <div>
            <p class="text-xs text-slate-500">Ngày giờ</p>
            <p class="font-medium">${dateStr}</p>
            <p class="text-sm text-slate-600 mt-1">${a.location || '-'}</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-slate-500">Trạng thái</p>
            <p class="font-medium">${a.status || 'Đã lên lịch'}</p>
            <p class="text-sm text-slate-600 mt-1">${a.result_note || a.notes || ''}</p>
          </div>
        </div>
        <div class="mt-4 flex justify-end">
          <a href="saleSurvey.html?submissionId=${submissionId}&appointmentId=${a.appointment_id}" class="px-4 py-2 bg-blue-700 text-white rounded-md hover:bg-blue-800">Nhập kết quả</a>
        </div>
      `;
      list.appendChild(item);
    });
  }catch(err){ list.innerHTML = '<div class="p-4 text-red-600">Lỗi tải lịch hẹn</div>'; }
})();
</script>
</body>
</html>
