<style>
  body{font-family:Inter, sans-serif;background:#faf8ff}
</style>
</head>
<body class="flex flex-col min-h-screen bg-background">
  <div id="sale-sidebar"></div>
  <script src="saleSidebar.js"></script>

  <main class="flex-1 w-full max-w-[1440px] mx-auto px-8 md:px-12 py-6 md:py-8 flex flex-col min-w-0 bg-background">
    <div class="w-full">
      <div class="mb-lg flex flex-col md:flex-row md:items-end justify-between gap-md mb-6">
        <div>
          <h1 class="font-headline-xl text-headline-xl-mobile md:text-headline-xl text-on-surface">Lịch hẹn - Thông tin căn nhà</h1>
          <p class="font-body-md text-body-md text-on-surface-variant">Chi tiết lịch hẹn và thông tin bất động sản</p>
        </div>
        <div>
          <a id="header-create-link" href="#" class="px-6 py-2.5 bg-primary text-white font-bold rounded-lg hover:bg-primary-container shadow-lg shadow-primary/20 transition-all flex items-center gap-sm text-[14px]">
            <span class="material-symbols-outlined text-[18px]">add_circle</span>
            Tạo lịch hẹn
          </a>
        </div>
      </div>

      <div id="property-card" class="mb-lg bg-surface-container-lowest border border-outline-variant rounded-xl p-md md:p-lg shadow-sm hidden relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
      </div>

      <div id="appointments-list" class="space-y-4"></div>

      <div id="no-appointments" class="hidden p-lg rounded-xl border border-outline-variant bg-surface-container-lowest flex flex-col md:flex-row items-center justify-between gap-md relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-secondary"></div>
        <div>
          <p class="font-headline-md text-headline-md text-on-surface flex items-center gap-sm">
            <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">warning</span>
            Chưa có lịch hẹn
          </p>
          <p class="font-body-md text-body-md text-on-surface-variant mt-1">Hiện tại chưa có lịch hẹn cho yêu cầu này.</p>
        </div>
        <div>
          <a id="create-link" class="px-6 py-2.5 bg-primary text-white font-bold rounded-lg hover:bg-primary-container shadow-lg shadow-primary/20 transition-all flex items-center gap-sm" href="#">
            <span class="material-symbols-outlined text-[18px]">add_circle</span>
            Tạo lịch hẹn
          </a>
        </div>
      </div>

    </div>
  </main>

<script src="api.js"></script>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const submissionId = params.get('submissionId');
  if(!submissionId) return;
  try{ await requireLogin(); } catch(e){ console.error(e); return; }

  const propCard = document.getElementById('property-card');
  const list = document.getElementById('appointments-list');
  const noAppt = document.getElementById('no-appointments');
  const createLink = document.getElementById('create-link');
  createLink.href = `saleMeet.html?submissionId=${submissionId}&create=1`;
  
  const headerCreateLink = document.getElementById('header-create-link');
  if (headerCreateLink) {
    headerCreateLink.href = `saleMeet.html?submissionId=${submissionId}&create=1`;
  }

  propCard.innerHTML = `<div class="text-sm text-slate-500">Đang tải thông tin...</div>`;
  propCard.classList.remove('hidden');

  let prop = null;
  try{
    prop = await getConsignment(submissionId);
    if(prop){
      const sub = prop.submission || {};
      const owner = prop.owner || {};
      const code = sub.submission_id ? `KG-${String(sub.submission_id).padStart(5, '0')}` : '-';
      propCard.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-md">
          <div class="flex flex-col gap-xs">
            <p class="font-label-sm text-label-sm text-secondary">Mã yêu cầu</p>
            <p class="font-body-md text-body-md font-semibold text-on-surface">${code}</p>
          </div>
          <div class="flex flex-col gap-xs">
            <p class="font-label-sm text-label-sm text-secondary">Chủ nhà</p>
            <p class="font-body-md text-body-md font-semibold text-on-surface">${owner.full_name || '-'}</p>
          </div>
          <div class="flex flex-col gap-xs">
            <p class="font-label-sm text-label-sm text-secondary">Địa chỉ</p>
            <p class="font-body-md text-body-md font-semibold text-on-surface">${sub.address || '-'}</p>
          </div>
        </div>
      `;
      
      // Hide header create button if survey is already finished
      if (headerCreateLink && (sub.status === 'surveyed' || sub.status === 'cancelled' || sub.status === 'rejected')) {
        headerCreateLink.classList.add('hidden');
      }
    }
  }catch(e){ console.warn('No consignment', e); propCard.innerHTML = '<div class="text-sm text-slate-500">Không thể tải thông tin tài sản</div>'; }

  function generateGoogleCalendarLink(appt, propData) {
    if (!appt || !appt.scheduled_time) return '#';
    const startDate = new Date(appt.scheduled_time);
    const endDate = new Date(startDate.getTime() + 90 * 60 * 1000); // 1.5 hours later

    const formatGCalDate = (date) => {
        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    };

    const sub = (propData && propData.submission) || {};
    const requestCode = sub.submission_id ? `KG-${String(sub.submission_id).padStart(5, '0')}` : `KG-${submissionId}`;
    const ownerName = (propData && propData.owner && propData.owner.full_name) || 'Chủ nhà';

    const title = encodeURIComponent(`Khảo sát Bất động sản - Yêu cầu #${requestCode}`);
    const dates = `${formatGCalDate(startDate)}/${formatGCalDate(endDate)}`;
    const detailsText = encodeURIComponent(`Lịch khảo sát thực địa được phối hợp bởi HomeMatch.\nChủ nhà: ${ownerName}`);
    const location = encodeURIComponent(appt.location || sub.address || '');

    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${detailsText}&location=${location}`;
  }

  list.innerHTML = '<div class="p-4">Đang tải lịch hẹn...</div>';
  try{
    const resp = await listSaleAppointments({ submissionId });
    let appts = (resp && resp.items) ? resp.items : (Array.isArray(resp) ? resp : []);
    if (submissionId) {
      appts = appts.filter(a => String(a.submission_id || '') === String(submissionId));
    }
    if(!appts || appts.length === 0){ list.innerHTML = ''; noAppt.classList.remove('hidden'); return; }
    noAppt.classList.add('hidden');
    list.innerHTML = '';
    appts.forEach(a=>{
      const scheduled = a.scheduled_time || a.appointment_date;
      const dateStr = scheduled ? new Date(scheduled).toLocaleString() : '-';
      function getAppointmentStatusLabel(status) {
        const text = String(status || '').toLowerCase();
        if (text === 'scheduled' || text === 'đã đặt' || text === 'đã đặt lịch') return 'Đã đặt lịch';
        if (text === 'completed' || text === 'hoàn tất' || text === 'hoàn thành') return 'Đã hoàn thành';
        if (text === 'cancelled' || text === 'bị hủy') return 'Bị hủy';
        if (text === 'no_show' || text === 'chủ nhà vắng mặt' || text === 'vắng mặt') return 'Chủ nhà vắng mặt';
        return status || 'Đã đặt lịch';
      }

      const mapQuery = a.location || (prop && prop.submission && prop.submission.address) || '';
      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQuery)}`;
      const calendarUrl = generateGoogleCalendarLink(a, prop);

      const subStatus = prop && prop.submission && prop.submission.status;
      const isSurveyDone = subStatus === 'surveyed' || subStatus === 'cancelled' || subStatus === 'rejected';

      const item = document.createElement('div');
      item.className = 'p-md md:p-lg bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm hover:shadow-md transition-shadow relative overflow-hidden mb-4';
      item.innerHTML = `
        <div class="absolute top-0 left-0 w-1 h-full bg-secondary"></div>
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-md">
          <div>
            <p class="font-label-sm text-label-sm text-secondary mb-1">Ngày giờ khảo sát</p>
            <p class="font-headline-md text-[18px] text-primary font-bold flex items-center gap-xs">
              <span class="material-symbols-outlined text-[20px]">calendar_today</span>
              ${dateStr}
            </p>
            <div class="flex items-center gap-xs text-on-surface-variant font-body-sm mt-2">
              <span class="material-symbols-outlined text-[18px]">location_on</span>
              <span>${a.location || '-'}</span>
              ${mapQuery ? `
                <a href="${mapUrl}" target="_blank" class="ml-2 text-primary hover:underline font-semibold flex items-center gap-[2px]">
                  <span class="material-symbols-outlined text-[14px]">map</span>Bản đồ
                </a>
              ` : ''}
            </div>
          </div>
          <div class="text-left md:text-right flex flex-col gap-xs">
            <p class="font-label-sm text-label-sm text-secondary">Trạng thái</p>
            <span class="inline-block px-3 py-1 bg-primary/10 text-primary font-label-sm text-label-sm rounded-full w-fit md:ml-auto">
              ${getAppointmentStatusLabel(a.status)}
            </span>
            <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">${a.result_note || a.notes || ''}</p>
          </div>
        </div>
        <div class="mt-md pt-md border-t border-outline-variant flex flex-col sm:flex-row justify-between items-center gap-md">
          <a href="${calendarUrl}" target="_blank" class="text-xs text-primary font-semibold hover:underline flex items-center gap-1">
            <span class="material-symbols-outlined text-[16px]">calendar_add_on</span>
            Thêm vào Google Calendar
          </a>
          <a href="saleSurvey.html?submissionId=${submissionId}&appointmentId=${a.appointment_id}" class="px-6 py-2.5 bg-primary text-white font-bold rounded-lg hover:bg-primary-container shadow-lg shadow-primary/20 transition-all flex items-center gap-sm">
            <span class="material-symbols-outlined text-[18px]">assignment_turned_in</span>
            Nhập kết quả khảo sát
          </a>
        </div>
      `;
      list.appendChild(item);
    });
  }catch(err){ list.innerHTML = '<div class="p-4 text-red-600">Lỗi tải lịch hẹn</div>'; }
})();
</script>
</body>
</html>
